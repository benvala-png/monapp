<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MonApp</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f8f4;
    --ink:#16211c;
    --ink-2:#4a5a51;
    --moss:#3f7357;
    --moss-d:#2e5a43;
    --sage:#7e9585;
    --berry:#7a3b52;
    --rule:#dce2d8;
    --card:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 20px calc(90px + env(safe-area-inset-bottom))}
  header{padding:32px 0 6px}
  h1{font-family:Fraunces,Georgia,serif;font-weight:300;font-size:38px;margin:0;letter-spacing:-.015em}
  header p{margin:5px 0 0;color:var(--sage);font-size:14px}

  /* ---------- nid d'abeille ---------- */
  .comb{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;padding-bottom:34px}
  .hex{
    position:relative;flex:0 0 calc(50% - 5px);
    aspect-ratio:1/1.1547;
    clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
    background:var(--moss);color:#fff;
    border:none;cursor:pointer;font:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;padding:10px;text-align:center;
  }
  .hex:nth-child(even){transform:translateY(30%)}
  .hex:nth-child(4n+3),.hex:nth-child(4n+4){background:var(--moss-d)}
  .hex .glyph{font-size:30px;line-height:1}
  .hex .label{
    font-family:Fraunces,Georgia,serif;font-weight:500;font-size:17px;line-height:1.15;
  }
  .hex .count{font-size:12px;opacity:.72}
  .hex:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
  .hex.muted{background:#e6ebe4;color:var(--ink-2)}

  /* ---------- listes & fiches ---------- */
  input[type=search],input[type=text]{
    width:100%;background:var(--card);color:var(--ink);
    border:1px solid var(--rule);border-radius:10px;padding:12px 14px;
    font:inherit;font-size:15px;margin-top:14px;
  }
  input:focus,button:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
  button{font:inherit;border:none;cursor:pointer}
  .btn{font-weight:600;font-size:15px;border-radius:10px;padding:13px 18px;background:var(--moss);color:#fff}
  .btn.ghost{background:transparent;border:1px solid var(--rule);color:var(--ink-2);font-weight:500}
  .btn.wide{width:100%;margin-top:12px;display:block}
  .item{
    display:block;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--rule);border-radius:12px;padding:15px 16px;margin-bottom:9px;color:inherit;
  }
  .item h3{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:19px;margin:0}
  .meta{font-size:13px;color:var(--sage);margin-top:4px}
  .facts{display:flex;border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin:18px 0 6px;background:var(--card)}
  .facts div{flex:1;padding:12px 8px;text-align:center;border-right:1px solid var(--rule)}
  .facts div:last-child{border-right:none}
  .facts b{display:block;font-family:Fraunces,Georgia,serif;font-size:21px;font-weight:600}
  .facts span{font-size:11.5px;color:var(--sage)}
  article h1{font-size:31px;margin:4px 0 2px}
  article h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:21px;margin:28px 0 8px}
  article h3{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:17px;margin:20px 0 6px}
  article p{margin:0 0 14px;max-width:68ch}
  article ul,article ol{margin:0 0 16px;padding-left:22px}
  article li{margin-bottom:6px}
  article table{width:100%;border-collapse:collapse;margin:6px 0 18px;font-size:15px}
  article td,article th{border-bottom:1px solid var(--rule);padding:8px 4px;text-align:left}
  article hr{border:none;border-top:1px solid var(--rule);margin:24px 0}
  .bar{display:flex;align-items:center;gap:12px;padding:22px 0 2px}
  .bar .btn{padding:9px 14px;font-size:14px}
  .bar h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:20px;margin:0}
  .note{font-size:13.5px;color:var(--sage);line-height:1.5;margin:12px 0 0}
  .log{font-size:13.5px;padding:12px 14px;border-radius:10px;margin-top:14px;border:1px solid var(--rule);background:var(--card);color:var(--ink-2);white-space:pre-wrap}
  .log.err{border-color:#c9a2ae;color:var(--berry)}
  .empty{padding:40px 10px;text-align:center;color:var(--sage)}

  /* ---------- réglages discrets ---------- */
  .dots{
    position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));
    width:46px;height:46px;border-radius:50%;
    background:var(--card);border:1px solid var(--rule);color:var(--ink-2);
    font-size:20px;line-height:1;letter-spacing:1px;
    display:flex;align-items:center;justify-content:center;
  }
  .sheet{
    position:fixed;inset:0;background:rgba(22,33,28,.42);
    display:flex;align-items:flex-end;justify-content:center;z-index:20;
  }
  .sheet .panel{
    background:var(--paper);width:100%;max-width:680px;
    border-radius:18px 18px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom));
  }
  .sheet h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:22px;margin:0 0 4px}
  .spin{display:inline-block;animation:t 1.1s linear infinite}
  @keyframes t{to{transform:rotate(1turn)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}

  /* ---------- utilitaires : EN DERNIER, et ce n'est pas cosmétique ----------
     `.hidden` était déclaré au milieu de la feuille, avant `.sheet{display:flex}`.
     Les deux ont la même spécificité — une classe — et à égalité c'est la
     DERNIÈRE déclarée qui gagne. `display:flex` écrasait donc `display:none` :
     le panneau des réglages ne pouvait pas se fermer, quoi que fasse le
     JavaScript. Le bug était dans l'ordre du CSS, pas dans le code.
     Une classe utilitaire se met en fin de feuille, où elle gagne les égalités. */
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">

  <!-- ACCUEIL : NID D'ABEILLE -->
  <div id="home">
    <header>
      <h1>MonApp</h1>
      <p id="tagline">Choisis un thème</p>
    </header>
    <div id="comb" class="comb"></div>
    <div id="homeLog" class="log hidden"></div>
  </div>

  <!-- LISTE D'UN THÈME -->
  <div id="theme" class="hidden">
    <div class="bar">
      <button class="btn ghost" data-nav="home">←</button>
      <h2 id="themeName"></h2>
    </div>
    <input type="search" id="q" placeholder="Chercher dans ce thème…">
    <div id="list"></div>
  </div>

  <!-- FICHE -->
  <div id="detail" class="hidden">
    <div class="bar"><button class="btn ghost" data-nav="theme">← Retour</button></div>
    <div id="facts"></div>
    <article id="body"></article>
  </div>

</div>

<button id="dots" class="dots" aria-label="Réglages">···</button>

<!-- PANNEAU RÉGLAGES -->
<div id="sheet" class="sheet hidden">
  <div class="panel">
    <h2>Réglages</h2>
    <p class="note">Lecture seule. Tout reste sur cet appareil, les appels vont directement à Google.</p>
    <input type="text" id="cClient" placeholder="ID client Google OAuth">
    <input type="text" id="cRoot" placeholder="Dossier racine (MonApp)">
    <button id="cSave" class="btn ghost wide">Enregistrer</button>
    <button id="refresh" class="btn wide">Recharger les fiches</button>
    <button id="close" class="btn ghost wide">Fermer</button>
    <div id="cfgLog" class="log hidden"></div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function(){
  "use strict";

  var mem = {};
  var store = {
    get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k]||null; } },
    set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
  };
  var $ = function(id){ return document.getElementById(id); };

  var GLYPHS = {
    plantes:"🌿", plante:"🌿", recettes:"🍅", recette:"🍅",
    jardin:"🌱", lecture:"📖", voyages:"🧭", voyage:"🧭",
    lego:"🧱", brico:"🔧", bricolage:"🔧", sante:"🫀", langues:"🗣️"
  };

  var cfg = { client:"", root:"MonApp" };
  var token = null;
  var cards = [];
  var current = null;

  function say(el, msg, err){
    el.textContent = msg;
    el.className = "log" + (err ? " err" : "");
    el.classList.toggle("hidden", !msg);
  }

  function loadCfg(){
    cfg.client = store.get("hbr_client") || "";
    cfg.root   = store.get("hbr_root")   || "MonApp";
    $("cClient").value = cfg.client;
    $("cRoot").value   = cfg.root;
  }
  $("cSave").addEventListener("click", function(){
    store.set("hbr_client", $("cClient").value.trim());
    store.set("hbr_root",  ($("cRoot").value.trim() || "MonApp"));
    loadCfg();
    say($("cfgLog"), "Réglages enregistrés.");
    // Refermer : un panneau de réglages qui reste ouvert après « Enregistrer »
    // laisse croire que rien ne s'est passé.
    $("sheet").classList.add("hidden");
  });

  /* ---------- navigation ---------- */
  function show(view){
    ["home","theme","detail"].forEach(function(v){
      $(v).classList.toggle("hidden", v !== view);
    });
    window.scrollTo(0,0);
  }
  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-nav]");
    if(b) show(b.getAttribute("data-nav"));
  });
  $("dots").addEventListener("click", function(){ $("sheet").classList.remove("hidden"); });
  $("close").addEventListener("click", function(){ $("sheet").classList.add("hidden"); });
  $("sheet").addEventListener("click", function(e){
    if(e.target === $("sheet")) $("sheet").classList.add("hidden");
  });

  /* ---------- Google ---------- */
  function connect(cb){
    if(!cfg.client){
      say($("homeLog"), "Ajoute ton ID client Google OAuth dans les réglages (bouton ··· en bas).", true);
      return;
    }
    if(!window.google || !google.accounts || !google.accounts.oauth2){
      say($("homeLog"), "Le script Google n'a pas pu se charger.", true); return;
    }
    google.accounts.oauth2.initTokenClient({
      client_id: cfg.client,
      scope:"https://www.googleapis.com/auth/drive.readonly",
      callback:function(r){
        if(r && r.access_token){ token = r.access_token; if(cb) cb(); }
        else say($("homeLog"), "Connexion Google refusée.", true);
      }
    }).requestAccessToken();
  }

  function api(path){
    return fetch("https://www.googleapis.com/drive/v3/" + path, {
      headers:{ Authorization:"Bearer " + token }
    }).then(function(r){
      if(!r.ok) return r.text().then(function(t){ throw new Error("Drive " + r.status + " — " + t.slice(0,160)); });
      return r.json();
    });
  }
  function q(s){ return encodeURIComponent(s); }

  function loadAll(){
    $("sheet").classList.add("hidden");
    say($("homeLog"), "Chargement…");
    var FOLDER = "application/vnd.google-apps.folder";
    api("files?q=" + q("name='" + cfg.root + "' and mimeType='" + FOLDER + "' and trashed=false") + "&fields=files(id,name)")
      .then(function(d){
        if(!d.files.length) throw new Error("Dossier « " + cfg.root + " » introuvable.");
        return api("files?q=" + q("'" + d.files[0].id + "' in parents and mimeType='" + FOLDER + "' and trashed=false") + "&fields=files(id,name)");
      })
      .then(function(d){
        return Promise.all(d.files.map(function(f){
          return api("files?q=" + q("'" + f.id + "' in parents and trashed=false") + "&fields=files(id,name)")
            .then(function(r){
              // `total` sert à distinguer « dossier vide » de « dossier plein
              // de fichiers dont aucun n'est un .md » — deux situations qui
              // demandent deux gestes différents.
              return {
                folder: f.name,
                total: r.files.length,
                files: r.files.filter(function(x){ return /\.md$/i.test(x.name); })
              };
            });
        }));
      })
      .then(function(groups){
        var jobs = [];
        groups.forEach(function(g){
          if(!g.files.length) jobs.push(Promise.resolve({ folder:g.folder, empty:true, total:g.total }));
          g.files.forEach(function(f){
            jobs.push(
              fetch("https://www.googleapis.com/drive/v3/files/" + f.id + "?alt=media", {
                headers:{ Authorization:"Bearer " + token }
              }).then(function(r){ return r.text(); })
                .then(function(txt){
                  var p = parse(txt);
                  return { name:f.name, folder:g.folder, meta:p.meta, md:p.body };
                })
            );
          });
        });
        return Promise.all(jobs);
      })
      .then(function(all){
        cards = all.filter(function(x){ return !x.empty; });
        var empties = {};
        all.filter(function(x){ return x.empty; })
           .forEach(function(x){ empties[x.folder] = x.total; });
        say($("homeLog"), "");
        buildComb(empties);
      })
      .catch(function(e){ say($("homeLog"), e.message, true); });
  }

  /* ---------- frontmatter ---------- */
  function parse(txt){
    var m = txt.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
    if(!m) return { meta:{}, body:txt };
    var meta = {};
    m[1].split(/\r?\n/).forEach(function(line){
      var i = line.indexOf(":");
      if(i < 1) return;
      var k = line.slice(0,i).trim();
      var v = line.slice(i+1).trim().replace(/^["']|["']$/g,"");
      if(/^\[.*\]$/.test(v)) v = v.slice(1,-1).split(",").map(function(s){ return s.trim(); }).filter(Boolean);
      meta[k] = v;
    });
    return { meta:meta, body:m[2] };
  }

  /* ---------- accueil ---------- */
  function buildComb(empties){
    var host = $("comb");
    host.innerHTML = "";
    var folders = {};
    cards.forEach(function(c){ folders[c.folder] = (folders[c.folder]||0) + 1; });
    var ignores = empties || {};
    Object.keys(ignores).forEach(function(f){ if(!(f in folders)) folders[f] = 0; });

    var names = Object.keys(folders).sort();
    if(!names.length){
      host.innerHTML = "";
      say($("homeLog"), "Aucun thème trouvé dans « " + cfg.root + " ».", true);
      return;
    }
    $("tagline").textContent = "Choisis un thème";
    names.forEach(function(f){
      var b = document.createElement("button");
      b.className = "hex" + (folders[f] ? "" : " muted");
      var key = f.toLowerCase();
      b.innerHTML =
        '<span class="glyph">' + (GLYPHS[key] || "◆") + "</span>" +
        '<span class="label">' + esc(cap(f)) + "</span>" +
        '<span class="count">' + etiquette(folders[f], ignores[f]) + "</span>";
      b.addEventListener("click", function(){ openTheme(f); });
      host.appendChild(b);
    });
  }

  /* Dire POURQUOI un thème est vide : un dossier sans rien et un dossier
     rempli de fichiers qu'on ignore ne se corrigent pas de la même façon. */
  function etiquette(fiches, autres){
    if(fiches) return fiches + (fiches > 1 ? " fiches" : " fiche");
    if(autres) return autres + (autres > 1 ? " fichiers" : " fichier") + ", aucun .md";
    return "vide";
  }

  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

  function showConnectHex(){
    var host = $("comb");
    host.innerHTML = "";
    var b = document.createElement("button");
    b.className = "hex";
    b.innerHTML = '<span class="glyph">🔑</span><span class="label">Connecter<br>Drive</span>';
    b.addEventListener("click", function(){ connect(loadAll); });
    host.appendChild(b);
    var s = document.createElement("button");
    s.className = "hex muted";
    s.innerHTML = '<span class="glyph">···</span><span class="label">Réglages</span>';
    s.addEventListener("click", function(){ $("sheet").classList.remove("hidden"); });
    host.appendChild(s);
  }

  /* ---------- thème ---------- */
  function openTheme(folder){
    current = folder;
    $("themeName").textContent = cap(folder);
    $("q").value = "";
    renderList();
    show("theme");
  }

  function title(c){ return c.meta.titre || c.meta.nom || c.name.replace(/\.md$/i,""); }

  function subtitle(c){
    var t = c.meta.type;
    if(t === "recette"){
      var b = [];
      if(c.meta.portions) b.push(c.meta.portions + " portions");
      if(c.meta.kcal_portion) b.push(c.meta.kcal_portion + " kcal");
      var tot = (parseInt(c.meta.temps_preparation,10)||0) + (parseInt(c.meta.temps_cuisson,10)||0);
      if(tot) b.push(tot + " min");
      return b.join(" · ");
    }
    if(t === "plante"){
      var p = [];
      if(c.meta.nom_botanique) p.push(c.meta.nom_botanique);
      if(c.meta.arrosage_jours) p.push("arrosage tous les " + c.meta.arrosage_jours + " j");
      return p.join(" · ");
    }
    return Array.isArray(c.meta.tags) ? c.meta.tags.join(" · ") : "";
  }

  function renderList(){
    var term = $("q").value.trim().toLowerCase();
    var host = $("list");
    host.innerHTML = "";
    var shown = cards.filter(function(c){
      if(c.folder !== current) return false;
      if(!term) return true;
      return (title(c) + " " + c.md).toLowerCase().indexOf(term) > -1;
    }).sort(function(a,b){ return title(a).localeCompare(title(b)); });

    if(!shown.length){
      host.innerHTML = '<div class="empty">' + (term ? "Aucune fiche ne correspond." : "Aucune fiche dans ce thème.") + "</div>";
      return;
    }
    shown.forEach(function(c){
      var b = document.createElement("button");
      b.className = "item";
      var sub = subtitle(c);
      b.innerHTML = "<h3>" + esc(title(c)) + "</h3>" + (sub ? '<div class="meta">' + esc(sub) + "</div>" : "");
      b.addEventListener("click", function(){ openCard(c); });
      host.appendChild(b);
    });
  }
  $("q").addEventListener("input", renderList);

  /* ---------- fiche ---------- */
  function openCard(c){
    var f = $("facts");
    f.innerHTML = "";
    if(c.meta.type === "recette" && c.meta.kcal_portion){
      f.innerHTML = '<div class="facts">' +
        fact(c.meta.kcal_portion, "kcal") +
        fact(c.meta.proteines_g ? c.meta.proteines_g + " g" : "—", "protéines") +
        fact(c.meta.glucides_g  ? c.meta.glucides_g  + " g" : "—", "glucides") +
        fact(c.meta.lipides_g   ? c.meta.lipides_g   + " g" : "—", "lipides") +
        "</div><p class=\"note\">Par portion.</p>";
    } else if(c.meta.type === "plante" && c.meta.arrosage_jours){
      f.innerHTML = '<div class="facts">' +
        fact(c.meta.arrosage_jours + " j", "arrosage") +
        fact(c.meta.confiance_identification || "—", "identification") +
        "</div>";
    }
    $("body").innerHTML = window.marked ? marked.parse(c.md, { gfm:true }) : "<pre>" + esc(c.md) + "</pre>";
    show("detail");
  }
  function fact(v,l){ return "<div><b>" + esc(v) + "</b><span>" + esc(l) + "</span></div>"; }

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(ch){
      return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[ch];
    });
  }

  $("refresh").addEventListener("click", function(){ token ? loadAll() : connect(loadAll); });

  loadCfg();
  showConnectHex();
  if(cfg.client) connect(loadAll);

  // Service worker : il rend l'application installable et consultable hors
  // ligne. Enregistré APRÈS le démarrage pour ne pas retarder le premier
  // affichage, et sans bloquer quoi que ce soit s'il échoue — une app qui ne
  // s'installe pas reste une app qui fonctionne.
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
